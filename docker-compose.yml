# ----------------------------------------------------------------------
# Compose profiles (run only what you need):
#   core (always up) : backend, frontend, chromadb
#   (Ollama = natif sur l'hote, joignable via host.docker.internal:11434)
#   agents           : telegram, bruce
# Examples:
#   docker compose up                                 # core only
#   docker compose --profile agents up                # core + agent stack
# ----------------------------------------------------------------------
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexus_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/memory.json:/app/memory.json
      - ./backend/sessions.json:/app/sessions.json
      - ./backend/config.json:/app/config.json
      - ./backend/mission_logs:/app/mission_logs
      - ./backend/stl_output:/app/stl_output
      - ./backend/research_logs:/app/research_logs
      - ./backend/session_logs:/app/session_logs
      - ./backend/skills:/app/skills
      - ./backend/BRAIN:/app/BRAIN
      - ./frontend/dist:/frontend/dist:ro
      - ./archive/legacy/Nexus9.html:/archive/legacy/Nexus9.html:ro
      - ./archive/legacy/orbital_ui_vanilla:/archive/legacy/orbital_ui_vanilla:ro
      # Socket Docker en read-only : /v1/docker/containers utilise direct le socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
    env_file:
      - ./backend/.env
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
      - CHROMA_HOST=http://chromadb:8000
      - CORS_ORIGINS=http://localhost:5173,http://localhost:80,http://frontend:80
      - SKILLS_DIR=/app/skills
      - OBSIDIAN_VAULT_PATH=/app/BRAIN/BRAIN
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - chromadb
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexus_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  telegram:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexus_telegram
    profiles: ["agents"]
    command: python telegram_bot.py
    volumes:
      - ./backend/memory.json:/app/memory.json
      - ./backend/sessions.json:/app/sessions.json
      # Mount the bot source so edits apply on `up -d` without an image rebuild.
      - ./backend/telegram_bot.py:/app/telegram_bot.py
    env_file:
      - ./backend/.env
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
      # Backend runs NATIVELY on the host (START_ALL → native uvicorn), so the
      # bot must reach it via host.docker.internal, NOT the `backend` compose
      # service (which isn't running in the native setup → name won't resolve).
      - BACKEND_URL=http://host.docker.internal:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # No depends_on: backend — it's native, not a container. Depending on it
    # would make compose start a conflicting nexus_backend on :8000.
    restart: unless-stopped

  bruce:
    image: ghcr.io/all-hands-ai/openhands:latest
    container_name: nexus_bruce
    profiles: ["agents"]
    ports:
      - "3000:3000"
    environment:
      - SANDBOX_RUNTIME_CONTAINER_IMAGE=ghcr.io/all-hands-ai/runtime:latest
      - LOG_ALL_EVENTS=true
      - LLM_MODEL=ollama/qwen3:14b
      - LLM_BASE_URL=http://host.docker.internal:11434
      - LLM_API_KEY=ollama
      - WORKSPACE_BASE=/workspace
      - SANDBOX_USER_ID=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/workspace
      - bruce_state:/.openhands-state
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  chromadb:
    image: chromadb/chroma:latest
    container_name: nexus_chromadb
    ports:
      - "8001:8000"
    volumes:
      - nexus_chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped

volumes:
  bruce_state:
  nexus_chroma_data:
