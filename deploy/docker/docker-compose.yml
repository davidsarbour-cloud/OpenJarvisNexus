services:
  jarvis:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - OPENJARVIS_ENGINE_DEFAULT=ollama
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  ollama-models:

# NOTE: Le backend Nexus9 de David (C:\OpenJarvisNexus\backend\) est lancé
# localement via Python, pas via ce Dockerfile (qui cible l'upstream open-source).
# ChromaDB réel : backend/vault_data/chromadb (chemin local Windows)
# Pour un déploiement Docker custom Nexus9, créer deploy/docker/docker-compose.nexus9.yml
