global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'nexus9-monitor'

scrape_configs:
  # ── cAdvisor : Container metrics (CPU, RAM, Network, IO) ──
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # ── Prometheus itself ──
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ── Docker daemon (optionnel, si socat exposé) ──
  # - job_name: 'docker'
  #   static_configs:
  #     - targets: ['unix:///var/run/docker.sock']
