global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'nexus9-monitor'

scrape_configs:
  # ── cAdvisor : Container metrics (CPU, RAM, Network, IO) ──
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # ── Prometheus itself ──
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ── Nexus9 backend : métriques hardware host + GPU ──
  # uvicorn natif sur l'hôte -> host.docker.internal depuis le conteneur Prometheus.
  - job_name: 'nexus_backend'
    metrics_path: /metrics
    scrape_interval: 5s
    static_configs:
      - targets: ['host.docker.internal:8000']

  # ── Docker daemon (optionnel, si socat exposé) ──
  # - job_name: 'docker'
  #   static_configs:
  #     - targets: ['unix:///var/run/docker.sock']
