; Backend-local pytest config. Without this, `pytest` invoked from backend/
; falls through to the root pyproject.toml whose testpaths point at the
; upstream OpenJarvis library tests (not Nexus9).
;
; vault/test_claude_mem.py is an async integration *script* invoked manually
; (`python vault/test_claude_mem.py`), not a pytest unit — excluded below.

[pytest]
testpaths = tests
asyncio_mode = auto
# Default: skip the live smoke suite. Opt-in with `pytest -m live`.
addopts = -ra --strict-markers -m "not live"
markers =
    live: requires a running backend (uvicorn on :8000) + the Docker stack. Opt-in via `-m live`.
filterwarnings =
    ignore::DeprecationWarning:anthropic.*
norecursedirs = .venv vault BRAIN forge_reports session_logs

[coverage:run]
# Only the modules our unit tests actually exercise — measuring "coverage"
# against routers / forge_room / vault would just inflate the misses.
source =
    ollama_client
    trend_engine
omit =
    */__pycache__/*
    */tests/*

[coverage:report]
show_missing = true
skip_covered = false
precision = 1
