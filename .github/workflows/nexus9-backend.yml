name: Nexus9 Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/nexus9-backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/nexus9-backend.yml'
  workflow_dispatch:

concurrency:
  group: nexus9-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: Ruff (style + safety)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install 'ruff>=0.15'

      # Match the same exclude set the local pre-commit hook uses so CI and
      # local feedback stay consistent. Submodules (vault/claude-mem, vault/
      # superpowers) carry their own toolchain and aren't ours to police.
      - name: Run ruff
        run: |
          ruff check backend \
            --exclude .venv \
            --exclude vault/claude-mem \
            --exclude vault/superpowers

  pytest:
    name: Pytest (pure helpers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Only the deps the pure-helper tests actually touch — keeps the CI job
      # small. The big runtime deps (chromadb, trimesh, fastapi…) aren't
      # exercised by tests/test_pure_helpers.py.
      - name: Install minimal test deps
        run: pip install pytest pytest-asyncio pytest-cov httpx

      - name: Run pytest with coverage
        working-directory: backend
        # --cov-fail-under is intentionally loose (15%) — we measure two
        # modules (ollama_client + trend_engine) so the bar tracks the seed
        # tests, not the whole backend.
        run: python -m pytest -q --tb=short --cov --cov-report=term --cov-fail-under=15

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore
