# ════════════════════════════════════════════════════════
# Nexus9 — SonarQube configuration (Phase 8)
# ════════════════════════════════════════════════════════

sonar.projectKey=Nexus9
sonar.projectName=Nexus9
sonar.projectVersion=1.1
sonar.organization=d3dprintix

# Sources scannées (les seules zones de code applicatif)
sonar.sources=backend,frontend/src,smoke_test_nexus9.py,agent_logger.py
sonar.sourceEncoding=UTF-8

# Exclusions agressives — éviter de scanner les artefacts, archives, dépendances
sonar.exclusions=\
  **/node_modules/**,\
  **/.venv/**,\
  **/venv/**,\
  **/__pycache__/**,\
  **/dist/**,\
  **/.vite/**,\
  **/build/**,\
  **/target/**,\
  archive/**,\
  backend/.venv/**,\
  backend/stl_output/**,\
  backend/mission_logs/**,\
  backend/session_logs/**,\
  backend/research_logs/**,\
  backend/overnight_results/**,\
  backend/vault_data/**,\
  backend/commerce_data/**,\
  backend/error_logs/**,\
  backend/forge_output/**,\
  backend/forge_reports/**,\
  backend/shopify/images/**,\
  Nexusx9/**,\
  rust/**,\
  dependency-cruiser/**,\
  dependency-audit-report.txt,\
  dependency-report.txt,\
  **/*.min.js,\
  **/*.min.css,\
  **/*.bundle.js

# Tests
sonar.tests=backend,frontend/src
sonar.test.inclusions=**/test_*.py,**/*_test.py,**/tests/**,**/*.test.ts,**/*.test.tsx

# Langages
sonar.python.version=3.11
sonar.python.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.typescript.tsconfigPath=frontend/tsconfig.json

# Qualité — règles strictes pour les nouveaux fichiers Phase 1-7
sonar.python.pylint.reportPaths=pylint-report.txt

# Quality gate
sonar.qualitygate.wait=false
