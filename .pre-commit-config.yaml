repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.0
    hooks:
      - id: ruff
        args: [--fix]

  # Block new code duplicates on commit. Threshold is intentionally loose
  # (5% to start) — tighten once the backlog of existing clones is paid down.
  - repo: local
    hooks:
      - id: jscpd
        name: jscpd (frontend src + backend, max 5% duplication)
        language: system
        entry: npx --yes jscpd
        args:
          - backend/
          - frontend/src/
          - --min-tokens
          - "60"
          - --min-lines
          - "8"
          - --threshold
          - "5"
          - --silent
          - --gitignore
          - --ignore
          - "**/.venv/**,**/node_modules/**,**/__pycache__/**,**/vault/claude-mem/**,**/vault/superpowers/**,**/archive/**,**/dist/**,**/build/**,**/forge_reports/**,**/trend_snapshots/**,**/session_logs/**"
          - --reporters
          - console
        pass_filenames: false
        files: \.(py|ts|tsx)$
